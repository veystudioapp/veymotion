<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lớp Học Số — Giao bài, chấm điểm & sổ điểm</title>
<style>
:root{
  color-scheme: light;
  --page:#f4f4f1; --surface:#fcfcfb; --raised:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --wash:rgba(11,11,11,.045);
  --accent:#2a78d6; --accent-wash:#e3eefc; --accent-ink:#1c5cab;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --pend:#c3c2b7;
  --up:#006300; --down:#d03b3b;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --raised:#222221; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.06);
    --accent:#3987e5; --accent-wash:#16263b; --accent-ink:#9ec5f4;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --pend:#5a5955; --up:#0ca30c;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--page);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)} .small{font-size:12px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand b{font-size:16px}
.brand span{font-size:12px;color:var(--muted)}
#tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--ink2);display:flex;align-items:center;gap:6px}
.tab:hover{background:var(--wash)}
.tab.on{background:var(--accent-wash);color:var(--accent-ink);font-weight:600}
.badge{min-width:20px;padding:0 6px;border-radius:10px;background:var(--crit);color:#fff;font-size:11px;font-weight:600;line-height:18px;text-align:center}
main{padding:20px 24px 60px;max-width:1440px;margin:0 auto}

/* generic */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px;margin:0 0 12px}
.card h3{font-size:14px;margin:0 0 8px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-head h2{margin:0}
.btn{border:1px solid var(--border);background:var(--raised);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.warn{border-color:var(--serious);color:var(--ink)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 6px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
select,input[type=text],input[type=date],input[type=datetime-local],input[type=number],input:not([type]),textarea{
  border:1px solid var(--border);background:var(--raised);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld>span{font-size:12px;color:var(--ink2);font-weight:600}
.fld input,.fld select{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;background:var(--raised)}
.check i,.cls-tag i,.lg i,.tt-r i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.cls-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink2);border:1px solid var(--border);border-radius:6px;padding:1px 7px}
.form-err{color:var(--crit);min-height:1em;margin:4px 0}
.quick{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:-4px 0 12px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--raised)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;color:var(--ink2);border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-wash);color:var(--accent-ink);font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* status */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;flex:none}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--border);color:var(--ink2);white-space:nowrap}
.pill.open{border-color:var(--accent);color:var(--accent-ink)}
.rate{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--wash);color:var(--ink2);white-space:nowrap}
.rate.r1{background:var(--accent-wash);color:var(--accent-ink);font-weight:600}
.up{color:var(--up);font-weight:600} .down{color:var(--down);font-weight:600}

/* assign */
.grid-assign{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:18px;align-items:start}
.a-item{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--border)}
.a-item:first-child{border-top:0}
.a-main{flex:1;min-width:0}
.a-title{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.a-title b{font-size:14.5px}
.a-meta{font-size:12.5px;color:var(--ink2);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.a-desc{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-acts{display:flex;gap:6px;align-items:flex-start}
.mbar{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;margin-top:8px;max-width:420px}
.mbar span{display:block;height:100%}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;text-align:left}
button.tile{cursor:pointer}
button.tile:hover{background:var(--wash)}
button.tile.on{outline:2px solid var(--accent);outline-offset:-2px}
.tile .k{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.tile .k i{width:8px;height:8px;border-radius:50%}
.tile .v{font-size:24px;font-weight:650;margin-top:2px}
.tile .s{font-size:12px;color:var(--muted)}

/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:600;color:var(--ink2);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:1}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--wash)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td.c,.tbl th.c{text-align:center}
.tbl .cmt{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.tbl tfoot td{font-weight:600;background:var(--surface);position:sticky;bottom:0;border-top:1px solid var(--border)}
.book th.a{text-align:center;min-width:54px}
.book th.a small{display:block;font-weight:400;color:var(--muted)}
.book td.cell{text-align:center;cursor:pointer;font-variant-numeric:tabular-nums}
.book td.cell:hover{outline:1px solid var(--accent);outline-offset:-1px}
.book .sticky{position:sticky;left:0;background:var(--surface);z-index:2}
.book th.sticky{z-index:3}
.lo{color:var(--crit);font-weight:600}
.sup{font-size:10px;vertical-align:super;margin-left:1px}
.name-btn{border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font-weight:550;text-align:left}
.name-btn:hover{color:var(--accent);text-decoration:underline}

/* grading */
.grid-grade{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:18px;align-items:start}
.q-list{display:flex;flex-direction:column;max-height:calc(100vh - 260px);overflow:auto;margin:0 -8px}
.q-item{display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:9px 10px;cursor:pointer}
.q-item:hover{background:var(--wash)}
.q-item.on{background:var(--accent-wash)}
.q-item .t{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.q-item .m{font-size:12px;color:var(--ink2);display:flex;gap:8px;justify-content:space-between;margin-top:2px}
.attach{display:flex;gap:10px;align-items:center;border:1px dashed var(--axis);border-radius:10px;padding:10px 12px;margin:10px 0}
.attach .ic{width:34px;height:42px;border-radius:5px;background:var(--crit);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.score-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.score-row input{width:90px;font-size:20px;font-weight:650;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--border);background:var(--raised);border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer}
.chip:hover{background:var(--wash)}
.hist{border-left:2px solid var(--grid);padding-left:12px;margin-top:6px}
.hist div{margin:6px 0;font-size:12.5px}
.hist b{font-weight:600}

/* charts */
.charts{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-bottom:16px}
.charts .full{grid-column:1/-1}
.chart{width:100%;position:relative}
.chart svg{display:block;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:8px}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg .ln{width:16px;height:0;border-top:2px solid;display:inline-block}
.lg .ln.dash{border-top-style:dashed}
.ax{fill:var(--muted);font-size:11px}
.gl{stroke:var(--grid);stroke-width:1}
.base{stroke:var(--axis);stroke-width:1}
.dl{fill:var(--ink2);font-size:12px;font-weight:550}
.yl{fill:var(--ink2);font-size:12px}
.scroll-y{max-height:440px;overflow:auto}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.tip{position:fixed;z-index:100;pointer-events:none;background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:8px 10px;box-shadow:0 6px 24px rgba(0,0,0,.14);font-size:12.5px;min-width:140px;max-width:300px}
.tt-h{font-weight:650;margin-bottom:4px}
.tt-r{display:flex;align-items:center;gap:7px;margin:2px 0;color:var(--ink2)}
.tt-r b{margin-left:auto;color:var(--ink);padding-left:12px;font-variant-numeric:tabular-nums}

/* filters */
.filters{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.filters .fld{margin:0}

/* modal, toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.modal .card{width:min(860px,100%);max-height:calc(100vh - 40px);overflow:auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#1d1d1c;color:#f0efec;padding:9px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13px;animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

@media (max-width:980px){
  .grid-assign,.grid-grade,.charts{grid-template-columns:1fr}
  .top{flex-wrap:wrap}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>📘 Lớp Học Số</b><span>Môn Toán · GV Nguyễn Minh An · dữ liệu mẫu</span></div>
  <nav id="tabs"></nav>
  <button class="btn sm" data-act="reset" title="Xóa mọi thay đổi và tạo lại dữ liệu mẫu">↺ Dữ liệu mẫu</button>
</header>
<main id="app"></main>
<div id="tip" class="tip" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast"></div>

<script>
"use strict";
/* ================= Helpers ================= */
const DAY = 864e5, HOUR = 36e5;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const dtLocal = d => ymd(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
function parseDT(s) {
  const [d, t = '00:00'] = s.split('T');
  const [y, m, dd] = d.split('-').map(Number), [h, mi] = t.split(':').map(Number);
  return new Date(y, m - 1, dd, h, mi);
}
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n, d.getHours(), d.getMinutes());
const fmtD = d => pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear();
const fmtDM = d => pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
const fmtDT = d => fmtDM(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
const fmt1 = v => v == null || isNaN(v) ? '—' : v.toLocaleString('vi-VN', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const fmtScore = v => v == null ? '—' : (+v.toFixed(2)).toLocaleString('vi-VN');
const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
const avg = arr => arr.length ? arr.reduce((s, x) => s + x, 0) / arr.length : null;
const round2 = v => v == null ? null : Math.round(v * 100) / 100;
function fmtDur(ms) {
  if (ms < HOUR) return Math.max(1, Math.round(ms / 6e4)) + ' phút';
  const h = Math.round(ms / HOUR);
  if (h < 24) return h + ' giờ';
  const d = Math.floor(h / 24), r = h % 24;
  return d + ' ngày' + (r ? ' ' + r + ' giờ' : '');
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }

/* ================= Data ================= */
const STORE_KEY = 'lophocso-demo-v1';
const CLASS_COLOR = {'10A1': 'var(--s1)', '10A2': 'var(--s2)', '11B1': 'var(--s3)'};
const cc = id => CLASS_COLOR[id] || 'var(--muted)';
const COMMENTS = {
  9: ['Bài làm xuất sắc, trình bày rất đẹp!', 'Rất tốt, lời giải gọn và chính xác.'],
  8: ['Làm tốt, chú ý thêm phần kết luận.', 'Bài tốt, còn sai sót nhỏ ở câu cuối.'],
  6.5: ['Khá, cần trình bày các bước rõ hơn.', 'Nắm được bài, còn nhầm dấu ở vài chỗ.'],
  5: ['Đạt yêu cầu, cần luyện thêm dạng bài nâng cao.', 'Còn sai phần biến đổi, em xem lại ví dụ trong SGK.'],
  0: ['Chưa nắm vững kiến thức, cần ôn lại lý thuyết.', 'Bài làm thiếu nhiều bước, sẽ hướng dẫn thêm trên lớp.'],
};
const commentFor = (score, r) => { const k = score >= 9 ? 9 : score >= 8 ? 8 : score >= 6.5 ? 6.5 : score >= 5 ? 5 : 0; return COMMENTS[k][Math.floor(r * 2)]; };

function seed() {
  const R = rng(20261106), now = new Date(), t0 = startOfDay(now);
  const ho = ['Nguyễn', 'Trần', 'Lê', 'Phạm', 'Hoàng', 'Huỳnh', 'Phan', 'Vũ', 'Võ', 'Đặng', 'Bùi', 'Đỗ', 'Hồ', 'Ngô', 'Dương'];
  const dem = ['Văn', 'Thị', 'Minh', 'Ngọc', 'Gia', 'Hoàng', 'Thanh', 'Quốc', 'Bảo', 'Khánh', 'Thu', 'Đức', 'Anh', 'Phương'];
  const ten = ['An', 'Bình', 'Chi', 'Dũng', 'Duy', 'Giang', 'Hà', 'Hải', 'Hạnh', 'Hiếu', 'Hoa', 'Huy', 'Khoa', 'Lan', 'Linh', 'Long', 'Mai', 'Minh', 'My', 'Nam', 'Ngân', 'Nhi', 'Phúc', 'Quân', 'Quỳnh', 'Sơn', 'Tâm', 'Thảo', 'Trang', 'Tú', 'Vy', 'Yến'];
  const pick = a => a[Math.floor(R() * a.length)];
  const classes = ['10A1', '10A2', '11B1'].map(id => ({id}));
  const titles = {
    '10A1': ['Mệnh đề và tập hợp', 'Bất phương trình bậc nhất', 'Hàm số bậc hai', 'Đồ thị hàm số', 'Dấu tam thức bậc hai', 'Hệ thức lượng trong tam giác', 'Vectơ', 'Tích vô hướng', 'Ôn tập giữa kỳ I'],
    '10A2': ['Mệnh đề và tập hợp', 'Bất phương trình bậc nhất', 'Hàm số bậc hai', 'Đồ thị hàm số', 'Dấu tam thức bậc hai', 'Hệ thức lượng trong tam giác', 'Vectơ', 'Tích vô hướng', 'Ôn tập giữa kỳ I'],
    '11B1': ['Góc lượng giác', 'Hàm số lượng giác', 'Phương trình lượng giác', 'Dãy số', 'Cấp số cộng', 'Cấp số nhân', 'Giới hạn dãy số', 'Giới hạn hàm số', 'Hàm số liên tục'],
  };
  const desc = ['Làm các bài tập cuối bài trong SGK. Trình bày rõ ràng, nộp ảnh chụp hoặc file PDF.', 'Hoàn thành phiếu bài tập đã phát trên lớp, ghi đầy đủ các bước giải.', 'Làm 6 câu trắc nghiệm và 2 câu tự luận trong file đính kèm.'];
  const students = [], profile = {}, used = new Set();
  let sid = 0;
  for (const c of classes) for (let i = 0; i < 9; i++) {
    let name; do name = `${pick(ho)} ${pick(dem)} ${pick(ten)}`; while (used.has(name));
    used.add(name);
    const s = {id: 'S' + (++sid), name, classId: c.id};
    students.push(s);
    profile[s.id] = {ability: 4.6 + R() * 4.8, trend: (R() - 0.42) * 2.6, dil: 0.72 + R() * 0.27, lateP: R() * 0.3};
  }
  students.sort((a, b) => a.classId.localeCompare(b.classId) || a.name.split(' ').pop().localeCompare(b.name.split(' ').pop(), 'vi'));
  const assignments = [], subs = {};
  let aid = 0;
  classes.forEach((c, ci) => {
    for (let k = 0; k < 9; k++) {
      const assigned = addDays(t0, -58 + k * 7 + ci), due = addDays(assigned, 5); due.setHours(23, 59);
      const a = {id: 'A' + (++aid), title: titles[c.id][k], classId: c.id, assignedAt: ymd(assigned), dueAt: dtLocal(due), desc: desc[k % 3]};
      assignments.push(a);
      for (const s of students.filter(s => s.classId === c.id)) {
        const p = profile[s.id];
        if (due > now) { // bài đang mở: một số em đã nộp sớm
          if (R() < 0.45 * p.dil) { const at = new Date(assigned.getTime() + R() * (now - assigned)); subs[a.id + '|' + s.id] = {submittedAt: dtLocal(at), score: null, comment: '', attempts: 1, history: [{at: dtLocal(at), type: 'submit'}]}; }
          continue;
        }
        if (R() > p.dil) continue; // không nộp
        const late = R() < p.lateP;
        let at = late ? new Date(due.getTime() + (1 + R() * 40) * HOUR) : new Date(assigned.getTime() + (0.3 + R() * 0.69) * (due - assigned));
        if (at > now) at = new Date(now.getTime() - 20 * 6e4);
        let score = p.ability + p.trend * (k / 8 - 0.5) + (R() - 0.5) * 2.4 - (late ? 0.5 : 0);
        score = Math.max(0, Math.min(10, Math.round(score * 4) / 4));
        const sub = {submittedAt: dtLocal(at), score: null, comment: '', attempts: 1, history: [{at: dtLocal(at), type: 'submit'}]};
        subs[a.id + '|' + s.id] = sub;
        const graded = due < new Date(now - 2 * DAY) || R() < 0.25;
        if (!graded) continue;
        let gAt = new Date(Math.min(now - HOUR, due.getTime() + (1 + R() * 2) * DAY));
        if (gAt < at) gAt = new Date(at.getTime() + HOUR);
        if (score < 5.5 && R() < 0.75) {
          const cmt = 'Bài làm còn nhiều lỗi cơ bản, em xem lại phần lý thuyết và nộp lại nhé.';
          sub.history.push({at: dtLocal(gAt), type: 'redo', text: cmt});
          if (due < new Date(now - 20 * DAY)) { // đã nộp lại và được chấm
            const at2 = new Date(gAt.getTime() + (1 + R() * 3) * DAY), g2 = new Date(at2.getTime() + DAY);
            score = Math.min(10, score + 1.5 + Math.round(R() * 4) / 4);
            sub.attempts = 2; sub.submittedAt = dtLocal(at2);
            sub.history.push({at: dtLocal(at2), type: 'submit'});
            sub.score = score; sub.comment = 'Bài nộp lại đã tiến bộ. ' + commentFor(score, R());
            sub.history.push({at: dtLocal(g2), type: 'grade', score, text: sub.comment});
          } else { sub.redo = true; sub.comment = cmt; }
        } else {
          sub.score = score; sub.comment = commentFor(score, R());
          sub.history.push({at: dtLocal(gAt), type: 'grade', score, text: sub.comment});
        }
      }
    }
  });
  const fa = addDays(t0, 3), fd = addDays(t0, 9); fd.setHours(23, 59);
  assignments.push({id: 'A' + (++aid), title: 'Kiểm tra 15 phút (ôn tập)', classId: '10A1', assignedAt: ymd(fa), dueAt: dtLocal(fd), desc: 'Đề sẽ được mở vào ngày giao.'});
  return {classes, students, assignments, subs, seq: aid};
}

let DB;

const getA = id => DB.assignments.find(a => a.id === id);
const getS = id => DB.students.find(s => s.id === id);
const studentsOf = cid => DB.students.filter(s => s.classId === cid);
const getSub = (aId, sId) => DB.subs[aId + '|' + sId] || null;
const byDue = (a, b) => a.dueAt.localeCompare(b.dueAt);
const isGraded = sub => !!sub && sub.score != null && !sub.redo;
const needsGrading = sub => !!sub && !!sub.submittedAt && sub.score == null && !sub.redo;

const ST = {
  ontime:  {label: 'Đúng hạn', icon: '✓', color: 'var(--good)'},
  late:    {label: 'Nộp trễ', icon: '⏱', color: 'var(--warn)'},
  redo:    {label: 'Yêu cầu làm lại', icon: '↺', color: 'var(--serious)'},
  missing: {label: 'Quá hạn chưa nộp', icon: '✕', color: 'var(--crit)'},
  pending: {label: 'Chưa nộp (còn hạn)', icon: '○', color: 'var(--pend)'},
};
const ST_ORDER = ['ontime', 'late', 'redo', 'missing', 'pending'];
function statusOf(a, sub, now = new Date()) {
  if (sub && sub.redo) return 'redo';
  if (!sub || !sub.submittedAt) return parseDT(a.dueAt) < now ? 'missing' : 'pending';
  return parseDT(sub.submittedAt) > parseDT(a.dueAt) ? 'late' : 'ontime';
}
const stChip = st => `<span class="st"><i style="background:${ST[st].color}"></i>${ST[st].icon} ${ST[st].label}</span>`;
function aState(a, now = new Date()) {
  if (parseDT(a.assignedAt) > now) return 'upcoming';
  return parseDT(a.dueAt) < now ? 'closed' : 'open';
}
const rate = v => v == null ? null : v >= 8 ? 'Giỏi' : v >= 6.5 ? 'Khá' : v >= 5 ? 'Trung bình' : 'Yếu';
const rateChip = v => { const r = rate(v); return r ? `<span class="rate ${r === 'Giỏi' ? 'r1' : ''}">${r}</span>` : '<span class="muted">—</span>'; };
function trendOf(scores) {
  if (scores.length < 4) return null;
  const k = Math.min(3, Math.floor(scores.length / 2));
  return avg(scores.slice(-k)) - avg(scores.slice(0, k));
}
function trendHTML(d) {
  if (d == null) return '<span class="muted">—</span>';
  if (d >= 0.3) return `<span class="up">▲ +${fmt1(d)}</span>`;
  if (d <= -0.3) return `<span class="down">▼ −${fmt1(-d)}</span>`;
  return '<span class="muted">■ ổn định</span>';
}
const trendText = d => d == null ? '' : d >= 0.3 ? 'Tiến bộ +' + fmt1(d) : d <= -0.3 ? 'Giảm −' + fmt1(-d) : 'Ổn định';

/** Các lượt (bài × học sinh) đã giao, lọc theo lớp / học sinh / khoảng hạn nộp. */
function records({classId = '', studentId = '', from = '', to = ''} = {}) {
  const now = new Date(), out = [];
  const fromD = from ? parseDT(from) : null, toD = to ? parseDT(to + 'T23:59') : null;
  for (const a of [...DB.assignments].sort(byDue)) {
    if (classId && a.classId !== classId) continue;
    if (parseDT(a.assignedAt) > now) continue;
    const due = parseDT(a.dueAt);
    if (fromD && due < fromD) continue;
    if (toD && due > toD) continue;
    for (const s of studentsOf(a.classId)) {
      if (studentId && s.id !== studentId) continue;
      const sub = getSub(a.id, s.id);
      out.push({a, s, sub, st: statusOf(a, sub, now)});
    }
  }
  return out;
}
function stats(recs) {
  const c = {ontime: 0, late: 0, redo: 0, missing: 0, pending: 0};
  recs.forEach(r => c[r.st]++);
  const scores = recs.filter(r => isGraded(r.sub)).map(r => r.sub.score);
  const due = recs.length - c.pending;
  return {c, n: recs.length, due, scores, avg: avg(scores), onRate: due ? c.ontime / due : null,
    waiting: recs.filter(r => needsGrading(r.sub)).length, trend: trendOf(scores)};
}
function assignmentCodes(classId) {
  const now = new Date(), m = {};
  DB.assignments.filter(a => a.classId === classId && parseDT(a.assignedAt) <= now).sort(byDue).forEach((a, i) => m[a.id] = 'B' + (i + 1));
  return m;
}

    }).join('');
    const slug = s.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/gi, 'd').toLowerCase().replace(/\s+/g, '-');
    right = `<section class="card">
      <div class="card-head"><div><h2 style="margin-bottom:2px">${esc(s.name)} <span class="cls-tag"><i style="background:${cc(a.classId)}"></i>${a.classId}</span></h2>

  return `<div class="grid-grade">${left}${right}</div>`;
}

/* ---------- 4. Sổ điểm ---------- */
function bookData(classId, recsAll) {
  const as = [...new Map(recsAll.map(r => [r.a.id, r.a])).values()].sort(byDue);
  const codes = assignmentCodes(classId);
  const rows = studentsOf(classId).map(s => {
    const recs = recsAll.filter(r => r.s.id === s.id);
    return {s, recs, st: stats(recs), by: Object.fromEntries(recs.map(r => [r.a.id, r]))};
  }).filter(r => r.recs.length);
  return {as, codes, rows};
}
function cellHTML(r) {
  if (!r) return '<span class="muted">·</span>';
  if (r.st === 'redo') return '<span title="Yêu cầu làm lại">↺</span>';
  if (r.st === 'missing') return '<span class="lo" title="Quá hạn chưa nộp">✕</span>';
  if (r.st === 'pending') return '<span class="muted" title="Chưa nộp, còn hạn">○</span>';
  if (!isGraded(r.sub)) return '<span class="muted" title="Đã nộp, chờ chấm">…</span>';
  return `<span class="${r.sub.score < 5 ? 'lo' : ''}">${fmtScore(r.sub.score)}</span>${r.st === 'late' ? '<span class="sup" title="Nộp trễ">⏱</span>' : ''}`;
}
function spark(vals) {
  if (vals.length < 2) return '';
  const w = 70, h = 20, lo = Math.max(0, Math.min(...vals) - .5), hi = Math.min(10, Math.max(...vals) + .5), span = hi - lo || 1;
  const pts = vals.map((v, i) => [2 + i * (w - 4) / (vals.length - 1), h - 2 - (v - lo) / span * (h - 4)]);
  const [lx, ly] = pts[pts.length - 1];
  return `<svg width="${w}" height="${h}" style="vertical-align:middle"><polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" style="stroke:var(--ink2)" stroke-width="1.5" stroke-linejoin="round"/><circle cx="${lx}" cy="${ly}" r="2.5" style="fill:var(--accent)"/></svg>`;
}

    <div class="tiles">

        ${as.map(a => { const x = r.by[a.id]; return `<td class="cell" data-act="cell" data-key="${a.id}|${r.s.id}">${cellHTML(x)}</td>`; }).join('')}
        <td class="r num"><b>${fmt1(r.st.avg)}</b></td><td>${rateChip(r.st.avg)}</td><td class="r num">${r.st.onRate == null ? '—' : Math.round(r.st.onRate * 100) + '%'}</td>

}

/* ---------- 5. Báo cáo ---------- */
function weekKey(d) { const m = startOfDay(d); m.setDate(m.getDate() - (m.getDay() + 6) % 7); return ymd(m); }
function viewReport() {
  const f = ui.report;

  const filters = `<div class="filters">
    <label class="fld"><span>Hạn nộp từ</span><input type="date" data-ch="rep" data-f="from" value="${f.from}"></label>

    <label class="fld"><span>Học sinh</span><select data-ch="rep" data-f="studentId"><option value="">Tất cả học sinh</option>${stuOpts.map(s => `<option value="${s.id}" ${f.studentId === s.id ? 'selected' : ''}>${esc(s.name)}${f.classId ? '' : ' · ' + s.classId}</option>`).join('')}</select></label>

    <button class="btn link" data-act="rep-reset">Đặt lại</button><span class="spacer"></span>

    <div class="tile"><div class="k">Bài đã giao</div><div class="v num">${nA}</div><div class="s">${recs.length} lượt học sinh</div></div>
    <div class="tile"><div class="k"><i style="background:${ST.ontime.color}"></i>Nộp đúng hạn</div><div class="v num">${pct(st.c.ontime, st.due)}</div><div class="s">${st.c.ontime}/${st.due} lượt đã đến hạn</div></div>
    <div class="tile"><div class="k"><i style="background:${ST.late.color}"></i>Nộp trễ</div><div class="v num">${pct(st.c.late, st.due)}</div><div class="s">${st.c.late} lượt</div></div>
    <div class="tile"><div class="k"><i style="background:${ST.missing.color}"></i>Quá hạn chưa nộp</div><div class="v num">${st.c.missing}</div><div class="s">${pct(st.c.missing, st.due)}</div></div>
    <div class="tile"><div class="k">Điểm trung bình</div><div class="v num">${fmt1(st.avg)}</div><div class="s">${st.scores.length} bài đã chấm</div></div>
    <div class="tile"><div class="k">Chờ chấm</div><div class="v num">${st.waiting}</div><div class="s">bài</div></div></div>`;
  if (!recs.length) return `<section class="card">${filters}<div class="empty">Không có dữ liệu trong khoảng lọc.</div></section>`;

  // Bảng tổng hợp theo học sinh
  const byStu = new Map();
  recs.forEach(r => { if (!byStu.has(r.s.id)) byStu.set(r.s.id, []); byStu.get(r.s.id).push(r); });
  const sumRows = [...byStu.entries()].map(([sid, rs]) => ({s: getS(sid), st: stats(rs)})).sort((a, b) => (b.st.avg ?? -1) - (a.st.avg ?? -1));

        <td class="r num"><b>${fmt1(r.st.avg)}</b></td><td>${rateChip(r.st.avg)}</td><td style="white-space:nowrap">${spark(r.st.scores)} ${trendHTML(r.st.trend)}</td></tr>`).join('')}</tbody></table></div>
    </section>`;
}
function drawReportCharts(recs) {
  const f = ui.report;
  // Line: điểm TB theo tuần
  const weeks = [...new Set(recs.map(r => weekKey(parseDT(r.a.dueAt))))].sort();
  const wAvg = pred => weeks.map(w => round2(avg(recs.filter(r => pred(r) && weekKey(parseDT(r.a.dueAt)) === w && isGraded(r.sub)).map(r => r.sub.score))));
  let series;
  if (f.studentId) {
    const s = getS(f.studentId), clsRecs = records({...f, studentId: '', classId: s.classId});
    const cw = weeks.map(w => round2(avg(clsRecs.filter(r => weekKey(parseDT(r.a.dueAt)) === w && isGraded(r.sub)).map(r => r.sub.score))));
    series = [{name: s.name.split(' ').pop(), color: cc(s.classId), values: wAvg(() => true)}, {name: 'TB lớp ' + s.classId, color: 'var(--muted)', dashed: true, values: cw}];
    $('#lineTitle').textContent = `Điểm theo tuần — ${s.name} so với lớp`;
  } else {
    const cls = f.classId ? [f.classId] : DB.classes.map(c => c.id);
    series = cls.map(c => ({name: c, color: cc(c), values: wAvg(r => r.a.classId === c)}));
    $('#lineTitle').textContent = 'Điểm trung bình theo tuần' + (f.classId ? ' — lớp ' + f.classId : ' theo lớp');
  }
  $('#lgLine').innerHTML = series.length > 1 ? `<div class="legend">${series.map(s => `<span class="lg"><span class="ln ${s.dashed ? 'dash' : ''}" style="border-color:${s.color}"></span>${esc(s.name)}</span>`).join('')}</div>` : '';
  lineChart($('#cLine'), {xs: weeks.map(w => fmtDM(parseDT(w))), xsFull: weeks.map(w => `Tuần ${fmtDM(parseDT(w))} – ${fmtDM(addDays(parseDT(w), 6))}`), series, height: 270});

  // Stacked: tình trạng nộp theo bài
  const byA = new Map();
  recs.forEach(r => { if (!byA.has(r.a.id)) byA.set(r.a.id, {a: r.a, c: {ontime: 0, late: 0, redo: 0, missing: 0, pending: 0}}); byA.get(r.a.id).c[r.st]++; });
  stackChart($('#cStack'), [...byA.values()].map(x => ({label: (f.classId ? '' : x.a.classId + ' · ') + x.a.title, sub: 'Hạn ' + fmtDM(parseDT(x.a.dueAt)), c: x.c})));

  // Histogram
  const bins = Array(10).fill(0);
  st_scores(recs).forEach(v => bins[Math.min(9, Math.floor(v))]++);
  histChart($('#cHist'), bins);
}
const st_scores = recs => recs.filter(r => isGraded(r.sub)).map(r => r.sub.score);

/* ================= Charts (SVG) ================= */
const tip = $('#tip'); let tipOwner = null;
function showTip(html, x, y, owner) {
  tip.innerHTML = html; tip.hidden = false; tipOwner = owner;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let left = x + 14, top = y + 14;
  if (left + w > innerWidth - 8) left = x - w - 14;
  if (top + h > innerHeight - 8) top = y - h - 14;
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
function hideTip() { tip.hidden = true; tipOwner = null; }
document.addEventListener('mousemove', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el) showTip(el.dataset.tip, e.clientX, e.clientY, 'gen');
  else if (tipOwner === 'gen') hideTip();
});

function lineChart(host, {xs, xsFull, series, yMax = 10, height = 260}) {

function histChart(host, bins) {

  const W = Math.max(260, host.clientWidth), H = 250, m = {l: 30, r: 6, t: 12, b: 28}, iw = W - m.l - m.r, ih = H - m.t - m.b;

  let g = '';

    const tipH = `<div class='tt-h'>Điểm ${i} – ${i === 9 ? '10' : '<' + (i + 1)}</div><div class='tt-r'><i style='background:var(--s1)'></i>Số bài<b>${n} · ${pct(n, total)}</b></div>`;
    if (n) g += `<path d="M${x},${Y(0)}V${y + r}Q${x},${y} ${x + r},${y}H${x + bwid - r}Q${x + bwid},${y} ${x + bwid},${y + r}V${Y(0)}Z" style="fill:var(--s1)"/>`;
    g += `<rect x="${m.l + i * band}" y="${m.t}" width="${band}" height="${ih}" fill="transparent" data-tip="${esc(tipH)}"/>`;
    g += `<text class="ax" x="${m.l + i * band + band / 2}" y="${H - 8}" text-anchor="middle">${i}–${i + 1}</text>`;
  });
  g += `<line class="base" x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  host.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Phân bố điểm">${g}</svg>`;

  'grade-sel': d => { ui.grade.key = d.key; render(); },
  'grade-quick': d => { $('#gScore').value = d.v; },
  'grade-cmt': d => { const t = $('#gCmt'); t.value = (t.value.trim() ? t.value.trim() + ' ' : '') + d.t; t.focus(); },
  'grade-save': d => {
    const key = ui.grade.key, sub = DB.subs[key], raw = $('#gScore').value.replace(',', '.'), v = parseFloat(raw), cmt = $('#gCmt').value.trim();
    if (raw === '' || isNaN(v) || v < 0 || v > 10) { $('#gErr').textContent = 'Nhập điểm từ 0 đến 10.'; return; }
    const listBefore = gradeList().map(x => x.key), idx = listBefore.indexOf(key);
    const now = dtLocal(new Date());
    Object.assign(sub, {score: Math.round(v * 100) / 100, comment: cmt, redo: false, gradedAt: now});
    sub.history = sub.history || []; sub.history.push({at: now, type: 'grade', score: sub.score, text: cmt});
    save();
    if (d.next) { const rest = gradeList().map(x => x.key); ui.grade.key = rest.find(k => k !== key && listBefore.indexOf(k) > idx) || rest.find(k => k !== key) || key; }
    render(); toast(`Đã lưu ${fmtScore(sub.score)} điểm cho ${getS(key.split('|')[1]).name}`);
  },
  'grade-redo': () => {
    const key = ui.grade.key, sub = DB.subs[key], cmt = $('#gCmt').value.trim();
    if (!cmt) { $('#gErr').textContent = 'Hãy ghi nhận xét để học sinh biết cần sửa gì.'; $('#gCmt').focus(); return; }
    const now = dtLocal(new Date());
    Object.assign(sub, {redo: true, score: null, comment: cmt});
    sub.history = sub.history || []; sub.history.push({at: now, type: 'redo', text: cmt});
    save(); render(); toast('Đã yêu cầu ' + getS(key.split('|')[1]).name + ' làm lại');
  },
  'book-class': d => { ui.book.classId = d.id; render(); },
  'student': d => openStudent(d.id),
  'export-book': d => exportBook(!!d.all),
  'rep-preset': d => {
    ui.report.from = d.k === 'all' ? ymd(addDays(today, -120)) : ymd(addDays(today, d.k === '2w' ? -14 : -28));
    ui.report.to = ymd(addDays(today, 14)); render();
  },
  'rep-reset': () => { Object.assign(ui.report, {from: ymd(addDays(today, -63)), to: ymd(addDays(today, 14)), classId: '', studentId: ''}); render(); },
  'export-report': () => exportReport(),
  'modal-close': () => closeModal(),
};
document.addEventListener('click', e => {
  if (e.target.id === 'modal') return closeModal();
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const fn = ACT[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t.dataset, t); }
});
document.addEventListener('change', e => {
  const t = e.target, ch = t.dataset.ch;
  if (!ch) return;
  if (ch === 'assign-class') ui.assign.classId = t.value;
  else if (ch === 'track-a') { ui.track.aId = t.value; ui.track.filter = 'all'; }
  else if (ch === 'grade-class') { ui.grade.classId = t.value; ui.grade.aId = ''; ui.grade.key = null; }
  else if (ch === 'grade-a') { ui.grade.aId = t.value; ui.grade.key = null; }
  else if (ch === 'rep') ui.report[t.dataset.f] = t.value;
  render();
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'assignForm') return;
  e.preventDefault();
  const f = e.target, fd = new FormData(f), err = $('#formErr');
  const title = fd.get('title').trim(), assignedAt = fd.get('assignedAt'), dueAt = fd.get('dueAt'), desc = fd.get('desc').trim();
  const ed = ui.assign.editId ? getA(ui.assign.editId) : null, cls = ed ? [ed.classId] : fd.getAll('cls');
  if (!title) return err.textContent = 'Nhập tiêu đề bài tập.';
  if (!cls.length) return err.textContent = 'Chọn ít nhất một lớp.';
  if (!assignedAt || !dueAt) return err.textContent = 'Chọn ngày giao và hạn nộp.';
  if (parseDT(dueAt) <= parseDT(assignedAt)) return err.textContent = 'Hạn nộp phải sau ngày giao.';
  if (ed) { Object.assign(ed, {title, assignedAt, dueAt, desc}); toast('Đã cập nhật bài tập'); }
  else {
    cls.forEach(c => DB.assignments.push({id: 'A' + (++DB.seq), title, classId: c, assignedAt, dueAt, desc}));
    toast(`Đã giao "${title}" cho ${cls.join(', ')}`);
  }
  ui.assign.editId = null; save(); render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if ($('#modal').hidden) render(); }, 150); });

render();
</script>
</body>
</html>
